<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Soil station system architecture</title><desc id="desc">Four soil measurements feed sensor interfaces and an ESP32 controller, then local storage, accessible output and optional network, with protected low-voltage power beneath.</desc><rect width="1200" height="620" fill="#f8f6ef"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f4f78"/></marker></defs><g font-family="Arial,sans-serif" fill="#191919"><text x="55" y="65" font-size="38" font-weight="700">SOIL STATION — SYSTEM ARCHITECTURE</text></g><g stroke="#191919" stroke-width="3" fill="#fff"><rect x="55" y="120" width="180" height="260" rx="12"/><rect x="290" y="120" width="180" height="260" rx="12"/><rect x="535" y="150" width="170" height="200" rx="12"/><rect x="770" y="100" width="180" height="120" rx="12"/><rect x="770" y="250" width="180" height="130" rx="12"/><rect x="1010" y="175" width="140" height="120" rx="12"/><rect x="250" y="455" width="720" height="105" rx="12" fill="#fff3ef"/></g><g stroke="#1f4f78" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M235 250H290"/><path d="M470 250H535"/><path d="M705 220H770"/><path d="M705 285H770"/><path d="M950 285H1010"/></g><g font-family="Arial,sans-serif" fill="#191919"><text x="85" y="155" font-size="22" font-weight="700">PHENOMENA</text><text x="85" y="200" font-size="20">Moisture</text><text x="85" y="240" font-size="20">Temperature</text><text x="85" y="280" font-size="20">Conductivity</text><text x="85" y="320" font-size="20">pH (optional)</text><text x="318" y="155" font-size="22" font-weight="700">INTERFACE</text><text x="320" y="210" font-size="19">Analog ADC</text><text x="320" y="250" font-size="19">1-Wire digital</text><text x="320" y="290" font-size="19">Documented EC/pH</text><text x="320" y="320" font-size="19">interfaces</text><text x="575" y="205" font-size="22" font-weight="700">ESP32</text><text x="565" y="245" font-size="19">controller</text><text x="565" y="285" font-size="19">timestamp + QA</text><text x="795" y="145" font-size="22" font-weight="700">LOCAL STORAGE</text><text x="810" y="185" font-size="19">microSD · offline</text><text x="795" y="290" font-size="22" font-weight="700">ACCESSIBLE OUTPUT</text><text x="800" y="330" font-size="18">visual · audio · tactile</text><text x="1025" y="215" font-size="20" font-weight="700">OPTIONAL</text><text x="1030" y="250" font-size="18">Wi-Fi / data</text><text x="275" y="500" font-size="22" font-weight="700">PROTECTED LOW-VOLTAGE POWER</text><text x="275" y="535" font-size="18">fuse / polarity protection → regulation → controller · sensors · storage · interface</text></g></svg>