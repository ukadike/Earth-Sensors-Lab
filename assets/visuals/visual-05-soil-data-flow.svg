<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Core Soil Sensing Station data flow</title><desc id="desc">Moisture and temperature sensors feed a conversion and control stage, then local storage, accessible output and an optional network path. A separate protected low-voltage power path supports the instrument.</desc><rect width="1200" height="620" fill="#f8f6ef"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#205a8a"/></marker></defs><g stroke="#191919" stroke-width="3" fill="#fff"><rect x="60" y="150" width="190" height="120" rx="12"/><rect x="60" y="320" width="190" height="120" rx="12"/><rect x="335" y="200" width="210" height="170" rx="12"/><rect x="635" y="120" width="180" height="120" rx="12"/><rect x="635" y="300" width="180" height="130" rx="12"/><rect x="900" y="210" width="180" height="130" rx="12"/><rect x="220" y="495" width="700" height="80" rx="12" fill="#fff1ee"/></g><g stroke="#205a8a" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M250 210H335"/><path d="M250 380H335"/><path d="M545 250H635"/><path d="M545 320H635"/><path d="M815 365H900"/></g><g font-family="Arial,sans-serif" fill="#191919"><text x="60" y="75" font-size="38" font-weight="700">CORE SOIL STATION — DATA + ACCESS FLOW</text><text x="90" y="200" font-size="22" font-weight="700">MOISTURE</text><text x="92" y="235" font-size="18">analog observation</text><text x="85" y="370" font-size="22" font-weight="700">TEMPERATURE</text><text x="92" y="405" font-size="18">digital observation</text><text x="370" y="245" font-size="22" font-weight="700">CONVERT + CONTROL</text><text x="370" y="285" font-size="18">measurement · timestamp</text><text x="370" y="320" font-size="18">quality state · metadata</text><text x="670" y="170" font-size="22" font-weight="700">LOCAL LOG</text><text x="670" y="205" font-size="18">offline storage</text><text x="660" y="345" font-size="22" font-weight="700">ACCESSIBLE OUTPUT</text><text x="660" y="382" font-size="18">visual · audio · tactile</text><text x="935" y="255" font-size="22" font-weight="700">OPTIONAL</text><text x="935" y="292" font-size="18">network / data station</text><text x="245" y="540" font-size="20" font-weight="700">PROTECTED LOW-VOLTAGE POWER SUPPORTS ALL MODULES</text></g></svg>