<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Soil Sensing Station</title><desc id="desc">Accessible raised garden bed with separate moisture, temperature, conductivity and optional pH probes connected to a modular ESP32 enclosure, local storage and multimodal controls.</desc><rect width="1200" height="720" fill="#f8f6ef"/><g stroke="#191919" stroke-width="4" fill="none"><rect x="70" y="210" width="600" height="260" rx="8" fill="#d7b58a"/><rect x="70" y="290" width="600" height="180" fill="#77533b"/><rect x="720" y="145" width="360" height="390" rx="18" fill="#eeeeea"/><rect x="770" y="200" width="260" height="120" rx="8" fill="#111"/><circle cx="990" cy="405" r="44" fill="#f0c34d"/><rect x="790" y="372" width="48" height="48" rx="8" fill="#fff"/><rect x="855" y="372" width="48" height="48" rx="8" fill="#fff"/><rect x="920" y="372" width="48" height="48" rx="8" fill="#fff"/><path d="M170 290v145M285 290v145M400 290v145M515 290v145"/><path d="M170 250c35-70 70-70 105 0M285 250c35-70 70-70 105 0M400 250c35-70 70-70 105 0"/><path d="M170 435 C430 540 650 455 720 420"/><path d="M285 435 C500 560 660 485 720 440"/><path d="M400 435 C560 565 680 510 720 460"/><path d="M515 435 C610 550 690 530 720 480"/></g><g font-family="Arial, sans-serif" fill="#191919"><text x="70" y="90" font-size="42" font-weight="700">STUDENT-BUILT SOIL SENSING STATION</text><text x="90" y="190" font-size="24">Accessible raised bed</text><text x="735" y="120" font-size="24">Weather-resistant electronics + local interface</text><text x="790" y="245" font-size="22" fill="#fff">Moisture  23.4%</text><text x="790" y="280" font-size="22" fill="#fff">Temp      18.7°C</text><text x="140" y="500" font-size="20">MOISTURE</text><text x="255" y="500" font-size="20">TEMP</text><text x="395" y="500" font-size="20">EC</text><text x="495" y="500" font-size="20">pH (optional)</text><text x="740" y="590" font-size="22">local logging · tactile controls · audio · screen-readable output</text></g></svg>