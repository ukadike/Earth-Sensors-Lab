<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">Earth Sensors Lab Observatory</title><desc id="desc">Conceptual greenhouse observatory connecting accessible garden beds and environmental sensors to renewable energy, a central data station, an optical telescope and a radio telescope.</desc><rect width="1400" height="780" fill="#f8f6ef"/><g stroke="#1a1a1a" stroke-width="4" fill="none"><path d="M170 560V270L350 120h590l210 150v290"/><path d="M350 120v440M940 120v440"/><path d="M350 120l-180 150h980L940 120"/><rect x="220" y="410" width="330" height="130" fill="#d7b58a"/><rect x="620" y="330" width="250" height="170" rx="12" fill="#ecece8"/><circle cx="1040" cy="190" r="60"/><line x1="1040" y1="250" x2="1040" y2="390"/><path d="M1190 160q90 55 0 110q-90-55 0-110z"/><line x1="1190" y1="270" x2="1190" y2="390"/><path d="M420 125l60-90M500 125l60-90M580 125l60-90M660 125l60-90"/><path d="M830 80v-55M830 25l-40 35M830 25l40 35"/></g><g stroke="#3d6f5e" stroke-width="5"><line x1="275" y1="410" x2="275" y2="350"/><line x1="345" y1="410" x2="345" y2="330"/><line x1="415" y1="410" x2="415" y2="355"/><line x1="485" y1="410" x2="485" y2="340"/></g><g font-family="Arial,sans-serif" fill="#191919"><text x="70" y="70" font-size="44" font-weight="700">EARTH SENSORS LAB OBSERVATORY</text><text x="245" y="595" font-size="22">accessible garden + ground sensing</text><text x="640" y="375" font-size="22" font-weight="700">DATA STATION</text><text x="640" y="410" font-size="18">visual · audio · tactile</text><text x="975" y="430" font-size="20">optical telescope</text><text x="1130" y="430" font-size="20">radio telescope</text><text x="405" y="105" font-size="18">solar</text><text x="795" y="105" font-size="18">wind</text><text x="70" y="700" font-size="24" font-weight="700">SOIL → WATER → PLANTS → ATMOSPHERE → VIBRATION → LIGHT → RADIO → SPACE</text></g></svg>